name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        env:
          GOPRIVATE: github.com/ParallaxProtocol/*
        run: go build ./...

      - name: Vet
        env:
          GOPRIVATE: github.com/ParallaxProtocol/*
        run: go vet ./...

      # Linux release builds turn on runtime/secret (Makefile), which
      # compiles secret_erase.go and backend/secret_test.go
      - name: Vet and test with runtime/secret
        env:
          GOPRIVATE: github.com/ParallaxProtocol/*
          GOEXPERIMENT: runtimesecret
        run: |
          go vet ./...
          go test . && go test ./backend/ -run 'TestWalletUnderRuntimeSecret|TestHardenProcess'

  # The backend's hardening on Windows (backend/harden_windows.go): a
  # hardened process tried from another of the same user, as Settings'
  # Security says it can't be read; built with cgo, as released, so the
  # hardware wallets' USB code is what runs under it
  windows-hardening:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      - name: Test
        shell: bash
        env:
          GOPRIVATE: github.com/ParallaxProtocol/*
          CGO_ENABLED: "1"
        run: go test ./backend/ -run '^TestHardenProcess$' -count=1 -v

  # The end-to-end tests that are Windows' own (e2e/tests/windows-shell.spec.ts:
  # the shell's processes shielded, and the app working under it) and the
  # app's core flows, on Windows as released: the real app on a runner's
  # desktop, the renderer sandboxed
  windows-e2e:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test
        shell: bash
        env:
          GOPRIVATE: github.com/ParallaxProtocol/*
        run: make e2e E2E_ARGS="tests/windows-shell.spec.ts tests/smoke.spec.ts tests/lock.spec.ts tests/bridge-seal.spec.ts"

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Type-check the Electron shell
        working-directory: desktop
        run: npm ci && npm run typecheck && npm run build

  # The end-to-end tests (e2e/): the real app, each test on its own
  # development chain, under a virtual display
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # make e2e runs them under xvfb-run, installed above
      - name: Build and test
        env:
          GOPRIVATE: github.com/ParallaxProtocol/*
        run: make e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
