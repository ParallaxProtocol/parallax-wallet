name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-gui:
    name: GUI ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            display_os: linux
            display_arch: x86_64
            target: linux/amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            display_os: linux
            display_arch: arm64
            target: linux/arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            display_os: macos
            display_arch: x86_64
            target: darwin/amd64
            runner: macos-14
          - os: darwin
            arch: arm64
            display_os: macos
            display_arch: arm64
            target: darwin/arm64
            runner: macos-14
          - os: windows
            arch: amd64
            display_os: windows
            display_arch: x86_64
            target: windows/amd64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The backend (Go with cgo for the hardware wallets' USB library,
      # built on each platform's own runner; darwin/amd64 by clang on the
      # arm64 runner), the frontend, and the
      # Electron shell packaged by electron-builder: the AppImage on Linux,
      # the DMG on macOS, the installer and the portable executable on
      # Windows, named as the in-app updater expects
      - name: Build release artifacts
        shell: bash
        env:
          GOPRIVATE: github.com/ParallaxProtocol/*
        run: |
          make prlx-gui-package \
            GOOS="${{ matrix.os }}" GOARCH="${{ matrix.arch }}" \
            VERSION="${{ steps.version.outputs.version }}"

      # The backend as the app carries it: the hardened runtime, and no
      # entitlements (the Makefile signs it so, electron-builder leaves it)
      - name: Check the backend's signature
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          bin="$(find build/package -path '*.app/Contents/Resources/backend/parallax-backend' | head -n1)"
          [ -n "$bin" ] || { echo "no backend in the app bundle"; exit 1; }
          codesign --verify --strict "$bin"
          codesign -dv "$bin" 2>&1 | grep -E '^CodeDirectory.*flags=.*runtime' || { echo "not signed with the hardened runtime"; exit 1; }
          ents="$(codesign -d --entitlements - --xml "$bin" 2>/dev/null)"
          if echo "$ents" | grep -q '<key>'; then echo "the backend carries entitlements:"; echo "$ents"; exit 1; fi
          echo "the backend: hardened runtime, no entitlements"

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: parallax-gui-${{ matrix.display_os }}-${{ matrix.display_arch }}
          path: |
            build/package/Parallax-Wallet-*
            !build/package/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish draft release
    needs: [build-gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release directory
        run: |
          mkdir -p release
          find artifacts -type f -name 'Parallax-Wallet-*' ! -name '*.blockmap' -exec cp {} release/ \;
          cd release
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Parallax-Wallet-*
            release/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
